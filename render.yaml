services:
  - type: web
    name: wasapinf
    runtime: python
    plan: free

    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: RENDER_EXTERNAL_URL
        sync: false

      - key: META_APP_ID
        sync: false

      - key: PYTHON_VERSION
        value: "3.12.0"