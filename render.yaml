services:
  - type: web
    name: wasapinf
    runtime: python
    plan: free

    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"

    envVars:
      # SQLite local dentro del servidor
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./wasapi.db"

      # Render genera automáticamente una clave segura
      - key: SECRET_KEY
        generateValue: true

      # URL pública de Render
      - key: RENDER_EXTERNAL_URL
        sync: false

      # Meta / WhatsApp
      - key: META_APP_ID
        sync: false

      - key: PYTHON_VERSION
        value: "3.12.0"
